name: Build AtlasLight (32-bit)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-i386:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out AtlasLight
        uses: actions/checkout@v4

      - name: Fetch litehtml (pinned commit)
        run: |
          git clone https://github.com/litehtml/litehtml third_party/litehtml
          git -C third_party/litehtml checkout ebb9d32b28cb8c0f6dff2257c1ace676da0dc4b1

      - name: Build inside a 32-bit Debian 12 container
        run: |
          docker run --rm -v "$PWD":/src -w /src i386/debian:bookworm bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config ca-certificates file \
              libgtk-3-dev libcurl4-openssl-dev libpango1.0-dev libcairo2-dev
            uname -m
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j2
            ctest --test-dir build --output-on-failure
            strip build/atlaslight
            file build/atlaslight || true
            (cd build && cpack -G DEB)
          '

      - name: Collect files
        run: |
          mkdir -p out
          cp build/atlaslight out/
          cp build/*.deb out/ || true
          file out/atlaslight

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: atlaslight-i386
          path: out/
          if-no-files-found: error
